<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Red Gradient -->
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="50%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    
    <!-- Metallic Teal Gradient -->
    <linearGradient id="logoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#00A8A8" />
      <stop offset="100%" stop-color="#005C5C" />
    </linearGradient>

    <!-- White Glow Filter to pop dark text on dark backgrounds -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#whiteGlow)">
    <!-- TOP ICON MARK (M) -->
    <g transform="translate(150, 20)">
      <path fill="url(#logoRedGrad)" d="
        M 125,250 
        L 125,65 
        L 250,155 
        L 375,65 
        L 375,250 
        L 310,250 
        L 310,145 
        L 250,190 
        L 190,145 
        L 190,250 
        Z" />

      <path fill="url(#logoTealGrad)" d="
        M 125,250 
        C 220,160 330,15 425,15 
        C 370,25 270,70 190,130 
        C 205,90 250,20 345,10 
        C 260,20 180,80 125,250 
        Z" />
    </g>

    <!-- TEXT BRANDING -->
    <g text-anchor="middle">
      <text x="400" y="380" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="96" letter-spacing="-2">
        <tspan fill="url(#logoRedGrad)">MEL</tspan><tspan fill="url(#logoTealGrad)">VEX</tspan>
      </text>

      <text x="400" y="445" fill="url(#logoTealGrad)" font-family="'Arial', 'Helvetica', sans-serif" font-weight="bold" font-size="36" letter-spacing="4">
        BUSINESS SOLUTIONS
      </text>
    </g>

    <!-- TAGLINE WITH ACCENT LINES -->
    <g transform="translate(0, 480)">
      <line x1="80" y1="-10" x2="210" y2="-10" stroke="url(#logoTealGrad)" stroke-width="4" stroke-linecap="round" />
      <text x="400" y="0" fill="url(#logoRedGrad)" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive" font-size="44" font-weight="bold">
        Your Growth, Our priority
      </text>
      <line x1="590" y1="-10" x2="720" y2="-10" stroke="url(#logoTealGrad)" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
