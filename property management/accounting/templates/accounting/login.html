<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant Login | Property Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .auth-card {
            max-width: 420px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
        }
        .brand-badge {
            background: #e0e7ff;
            color: #4338ca;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.15);
        }
        .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }
    </style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card auth-card shadow-sm w-100 border-0">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <span class="brand-badge d-inline-block mb-2">Finance Portal</span>
                <h3 class="fw-bold text-dark mb-1">Accountant Sign In</h3>
                <p class="text-muted small">Access financial reports, ledger entries, and rent accounting.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" autocomplete="off" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-dark small">Username or Email</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="accountant@propertypro.com" value="{{ username|default:'' }}" required autofocus>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label fw-semibold text-dark small mb-0">Password</label>
                        <a href="{% url 'admin_password_reset' %}" class="small text-decoration-none text-primary">Forgot?</a>
                    </div>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Keep me logged in</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                    Sign In to Ledger
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
