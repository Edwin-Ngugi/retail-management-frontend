<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | Property Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .auth-card {
            max-width: 420px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
        }
        .brand-badge {
            background: #e0e7ff;
            color: #4338ca;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.15);
        }
        .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }
        .forgot-link {
            color: #4f46e5;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card auth-card shadow-sm w-100 border-0">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <span class="brand-badge d-inline-block mb-2">Portal Admin</span>
                <h3 class="fw-bold text-dark mb-1">Sign In</h3>
                <p class="text-muted small">Enter your administrator credentials below.</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger fade show small py-2 mb-3" role="alert">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold text-dark small">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="id_password" class="form-label fw-semibold text-dark small mb-0">Password</label>
                        <a href="{% url 'admin_password_reset' %}" class="forgot-link small">Forgot password?</a>
                    </div>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mt-2">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
